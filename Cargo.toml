[package]
name = "anti-burn"
version = "0.1.0"
edition = "2021"
description = "Native Windows OLED burn-in prevention suite with Z-order active window dimming, taskbar proximity dimming, hardware Magnification API idle dimming, and a coupled flow-field + metaballs screensaver."
license = "GPL-3.0-or-later"
repository = "https://github.com/levilansing/anti-burn-win"
readme = "README.md"

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "dwmapi",
    "shellapi",
    "shobjidl_core",
    "libloaderapi",
    "sysinfoapi",
    "errhandlingapi",
    "shellscalingapi",
    "processthreadsapi",
    "mmdeviceapi",
    "endpointvolume",
    "audioclient",
    "combaseapi",
    "objbase",
    "unknwnbase",
    "windef",
    "minwindef",
    "winnt",
    "winerror",
    "wincon",
    "commctrl",
    "uxtheme",
    "d3d11",
    "d3dcommon",
    "d3dcompiler",
    "dxgi",
    "dxgi1_2",
    "dcomp",
    "d2d1",
] }
